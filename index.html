<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FPS 3D Web Game</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    /* ایزوله‌سازی کامل لایه‌های منو جهت جلوگیری از قفل شدن تاچ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 20, 0.94);
      z-index: 999999 !important;
      align-items: center;
      justify-content: center;
      pointer-events: auto !important;
    }
    .modal-box {
      width: 90%;
      max-width: 380px;
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 20px;
      color: white;
      text-align: center;
      pointer-events: auto !important;
      position: relative;
      z-index: 1000000 !important;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer !important;
      color: white;
      pointer-events: auto !important;
      touch-action: manipulation;
    }
    .btn-success { background: #10b981; }
    .btn-blue { background: #0284c7; }
    #err-popup {
      display: none;
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: #dc2626;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      z-index: 9999999;
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <!-- جعبه ره‌گیری و نمایش خطاهای سیستمی جاوااسکریپت -->
  <div id="err-popup"></div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>
  <div id="flash"></div>
  <div id="damage-overlay"></div>
  <div id="invincible-overlay"></div>
  <div id="status-toast">پیام</div>
  <div id="respawn-banner">💀 نابود شدید!<br><span style="font-size:14px; margin-top:8px;">در حال بازگشت...</span></div>

  <div id="hud">
    <div id="btn-settings-gear">⚙️</div>
    <div class="hud-chip hud-health-chip">
      <span>❤️ <b id="player-hp">100</b></span><span class="hud-divider">|</span><span>🛡️ <b id="player-shield">قفل</b></span>
    </div>
    <div class="hud-chip hud-weapon-chip" id="weapon-switch-btn" title="تغییر اسلحه">
      <span id="weapon-name-chip">🔫 M4</span><span class="hud-divider">|</span><span id="ammo-indicator">30/30</span>
    </div>
    <div class="hud-chip">
      <span>💀 <b id="kills-total" style="color:#ef4444;">0</b></span><span class="hud-divider">|</span><span>⚡ <b id="killstreak-indicator" style="color:#eab308;">0</b></span>
    </div>
    <div class="hud-chip"><span>💣 <b id="grenade-indicator" style="color:#f97316;">5</b></span></div>
    <div class="hud-chip hud-mini-chip" id="mp-chip">تک‌نفره</div>
    <div class="hud-chip hud-jetpack-chip"><span>🚀</span><div id="fuel-bar-container"><div id="fuel-bar-fill"></div></div></div>
  </div>

  <div id="joystick-zone" class="hud-draggable"><div id="joystick-knob"></div></div>
  <div id="touch-look-zone"></div>
  
  <div id="btn-shoot" class="hud-draggable btn-action">🔥</div>
  <div id="btn-jump" class="hud-draggable btn-action">🦘</div>
  <div id="btn-slide" class="hud-draggable btn-action">🏃</div>
  <div id="btn-ads" class="hud-draggable btn-action">🎯</div>
  <div id="btn-reload" class="hud-draggable btn-action">🔄</div>
  <div id="btn-grenade" class="hud-draggable btn-action">💣</div>
  <div id="btn-heal" class="hud-draggable btn-action">💉</div>
  <div id="btn-hook" class="hud-draggable btn-action">🪝</div>
  <div id="btn-call-crate" class="hud-draggable btn-action">📦</div>
  <div id="btn-ability" class="hud-draggable btn-action">✨</div>

  <!-- مودال ۱: منوی اصلی ورود -->
  <div id="menu-modal" class="modal-overlay" style="display: flex;">
    <div class="modal-box">
      <h2 style="color: #38bdf8; margin-bottom: 15px;">🎮 نبرد اکشن سه‌بعدی</h2>
      <button class="btn-primary btn-success" id="btn-start-flow-solo">👤 شروع تک‌نفره</button>
      <button class="btn-primary btn-blue" id="btn-start-flow-mp">🌐 چندنفره</button>
    </div>
  </div>

  <!-- مودال ۲: انتخاب کاراکتر -->
  <div id="character-select-modal" class="modal-overlay">
    <div class="modal-box selection-box">
      <h3 style="color: #facc15; margin-bottom: 8px;">🛡️ انتخاب کلاس مبارز</h3>
      <div class="scroll-container" id="character-list-container"></div>
      <button class="btn-primary btn-next" id="btn-confirm-character">تایید کاراکتر ➔</button>
    </div>
  </div>

  <!-- مودال ۳: انتخاب اسلحه -->
  <div id="weapon-select-modal" class="modal-overlay">
    <div class="modal-box selection-box">
      <h3 style="color: #f97316; margin-bottom: 8px;">🔫 انتخاب سلاح اصلی</h3>
      <div class="scroll-container" id="weapon-list-container"></div>
      <button class="btn-primary btn-next" id="btn-confirm-weapon">تایید سلاح ➔</button>
    </div>
  </div>

  <!-- مودال ۴: انتخاب نقشه -->
  <div id="map-select-modal" class="modal-overlay">
    <div class="modal-box selection-box" style="max-width: 95%; width: 480px;">
      <h3 style="color: #10b981; margin-bottom: 8px;">🗺️ انتخاب نقشه</h3>
      <div id="map-preview-container"></div>
      <div class="scroll-container" id="map-list-container" style="height: 90px;"></div>
      <button class="btn-primary btn-next" id="btn-confirm-map">🚀 شروع نبرد!</button>
    </div>
  </div>

  <!-- مودال ۵: اتصال چندنفره -->
  <div id="mp-options-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 style="color: #10b981;">🌐 اتصال چندنفره WebRTC</h3>
      <button class="btn-primary btn-success" id="btn-create-offer">ساخت اتاق (میزبان)</button>
      <textarea id="host-offer-text" readonly placeholder="کد تولید شده هاست..."></textarea>
      <textarea id="host-answer-input" placeholder="کد پاسخ مهمان را اینجا پیست کنید"></textarea>
      <button class="btn-primary" id="btn-confirm-host">تایید و اتصال میزبان</button>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin: 10px 0;">
      <textarea id="join-offer-input" placeholder="کد اتاق میزبان را اینجا پیست کنید"></textarea>
      <button class="btn-primary" style="background:#ef4444;" id="btn-create-answer">تولید کد پاسخ (مهمان)</button>
      <textarea id="join-answer-text" readonly placeholder="کد تولید شده را به میزبان بفرستید"></textarea>
      <button class="btn-primary btn-next" id="btn-mp-proceed">ورود به مرحله بعد ➔</button>
    </div>
  </div>

  <!-- ثبت و نمایش بلادرنگ خطاهای پنهان ماژول‌ها -->
  <script>
    function showErr(msg) {
      var box = document.getElementById('err-popup');
      if (box) {
        box.style.display = 'block';
        box.textContent = "🛑 خطای سیستم:\n" + msg;
      }
    }
    window.addEventListener('error', function(e) {
      showErr((e.message || 'Error') + '\nFile: ' + (e.filename || '') + '\nLine: ' + (e.lineno || ''));
    }, true);
    window.addEventListener('unhandledrejection', function(e) {
      showErr('Promise Rejection: ' + e.reason);
    });
  </script>

  <!-- کنترل مستقیم کلیک دکمه‌های منو -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var soloBtn = document.getElementById('btn-start-flow-solo');
      var mpBtn = document.getElementById('btn-start-flow-mp');
      var menuModal = document.getElementById('menu-modal');

      function hideMenu() {
        if (menuModal) menuModal.style.display = 'none';
      }

      function attachTrigger(el, targetModalId) {
        if (!el) return;
        var act = function(e) {
          e.preventDefault();
          e.stopPropagation();
          hideMenu();
          var target = document.getElementById(targetModalId);
          if (target) target.style.display = 'flex';
        };
        el.addEventListener('pointerdown', act);
        el.addEventListener('click', act);
      }

      attachTrigger(soloBtn, 'character-select-modal');
      attachTrigger(mpBtn, 'mp-options-modal');
    });
  </script>

  <script type="module" src="./main.js"></script>
</body>
                                                                                                                 </html>
